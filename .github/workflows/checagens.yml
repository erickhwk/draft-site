# Regra mecânica do site: cor só por token. Cor literal (hex, nome, rgb/hsl) só no :root de style.css.
name: Checagens
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes stylelint@16.26.1 "*.css"
  # Testes e2e do #contato (form, copiar e máscara). Formspree e wa.me são simulados no próprio teste.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1.64.1
      - run: |
          python3 -m http.server 8010 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8010/ >/dev/null && break; sleep 0.5; done
          node testes/contato.mjs
