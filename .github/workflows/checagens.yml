# Checagens do site: Stylelint (cor só por token; cor literal só no :root de style.css)
# e testes no navegador: #contato (testes/contato.mjs), logos de clientes sem fundo (testes/logos.mjs)
# e contraste AA do texto na home, na 404 e na política (testes/contraste.mjs).
name: Checagens
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes stylelint@16.26.1 "*.css"
  # Testes no navegador: #contato (form, copiar e máscara; Formspree e wa.me simulados) e logos de clientes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PW_CANAL: "" # Chromium da versão fixa do playwright-core, não o Chrome do runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright-core@1.64.1 axe-core@4.14.0
      - run: npx playwright-core install --with-deps chromium
      - run: |
          python3 -m http.server 8010 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8010/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8010/ >/dev/null || { echo "http.server não subiu na 8010"; exit 1; }
          node testes/contato.mjs; contato=$?
          node testes/logos.mjs; logos=$?
          node testes/contraste.mjs; contraste=$?
          exit $(( contato || logos || contraste ))
